[package]
name = "descend"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Training infrastructure primitives: optimizers, LR schedules, gradient clipping, early stopping"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/descend"
homepage = "https://github.com/arclabs561/descend"
readme = "README.md"
categories = ["science", "algorithms"]
keywords = ["optimizer", "training", "machine-learning", "gradient-descent", "learning-rate"]

[workspace]

[dependencies]
rand = "0.9"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }
ndarray = { version = "0.16", optional = true }
skel = { version = "0.1", optional = true }

[features]
serde = ["dep:serde"]
riemannian = ["dep:ndarray", "dep:skel"]
